<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script type="module" crossorigin src="./landing_assets/index-Dur577wo.js"></script>
    <link rel="stylesheet" crossorigin href="./landing_assets/index-Hrx1Im0O.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        function looksLikeAdminLoginHref(href) {
          if (!href) return false;
          try {
            href = String(href).trim().toLowerCase();
          } catch (e) {
            return false;
          }
          return href === '/admin-login' || href === 'admin-login' || href.endsWith('/admin-login') || href.endsWith('admin-login') || href.indexOf('admin-login') !== -1;
        }

        function hideElement(el) {
          if (!el || !el.style) return;
          el.style.display = 'none';
          el.style.visibility = 'hidden';
          el.style.pointerEvents = 'none';
        }

        function removeDuplicateAdminLoginButtons() {
          // Hide links whose href points to admin-login
          var links = document.querySelectorAll('a');
          for (var i = 0; i < links.length; i++) {
            var a = links[i];
            if (a.id === 'nav-admin-login') continue;

            var href = a.getAttribute('href');
            if (looksLikeAdminLoginHref(href)) {
              hideElement(a);
              continue;
            }

            var txt = (a.textContent || '').trim().toLowerCase();
            if (txt === 'admin login' || txt === 'admin') {
              hideElement(a);
            }
          }

          // Also hide any button that says Admin Login
          var buttons = document.querySelectorAll('button');
          for (var j = 0; j < buttons.length; j++) {
            var b = buttons[j];
            var btxt = (b.textContent || '').trim().toLowerCase();
            if (btxt === 'admin login' || btxt === 'admin') {
              hideElement(b);
            }
          }
        }

        removeDuplicateAdminLoginButtons();
        var mo = new MutationObserver(function () {
          removeDuplicateAdminLoginButtons();
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script>
      (function () {
        function normText(t){
          try { return String(t || '').replace(/\s+/g,' ').trim().toLowerCase(); }
          catch(e){ return ''; }
        }

        function makeNavItemLike(anchor, text, href, id){
          var el = anchor.cloneNode(true);
          el.textContent = text;
          el.setAttribute('href', href);
          if (id) el.id = id;
          return el;
        }

        function tryInjectIntoTopNav(){
          if (document.getElementById('nav-admin-login') || document.getElementById('nav-company-login')) return true;

          // Find the existing navbar link pattern (use the Enquire link as an anchor)
          var anchors = Array.prototype.slice.call(document.querySelectorAll('a'));
          var enquire = null;
          for (var i=0;i<anchors.length;i++){
            var a = anchors[i];
            var t = normText(a.textContent);
            if (t === 'enquire') { enquire = a; break; }
          }
          if (!enquire || !enquire.parentElement) return false;

          var parent = enquire.parentElement;

          var adminA = makeNavItemLike(enquire, 'Admin', '/admin-login', 'nav-admin-login');
          var companyA = makeNavItemLike(enquire, 'Company', '/founder-login.html', 'nav-company-login');

          parent.appendChild(adminA);
          parent.appendChild(companyA);

          // Force hard navigation for company login (avoid SPA router interceptions)
          companyA.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = '/founder-login.html';
          }, true);

          // Ensure admin login is also reachable even if router handlers exist
          adminA.addEventListener('click', function (e) {
            // Allow router to handle if it wants, but also ensure the URL is correct.
            // If a handler prevented default, we still hard-navigate.
            setTimeout(function(){
              if (window.location.pathname !== '/admin-login') {
                window.location.href = '/admin-login';
              }
            }, 0);
          }, true);

          return true;
        }

        // Run now and also observe for SPA-rendered header.
        if (!tryInjectIntoTopNav()) {
          var mo = new MutationObserver(function(){
            if (tryInjectIntoTopNav()) mo.disconnect();
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>

    <script>
      (function () {
        function shouldShow() {
          try {
            var p = String(window.location.pathname || '').toLowerCase();
            return (
              p === '/admin' || p.indexOf('/admin/') === 0 ||
              p === '/admin-login' || p.indexOf('/admin-login') === 0
            );
          } catch (e) {
            return false;
          }
        }

        function removeIfNotNeeded() {
          if (shouldShow()) return;
          var existing = document.getElementById('nav-data-entries');
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }
        }

        function findLogoutControl() {
          // Prefer a visible button that says "Logout" (admin dashboard header)
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            var b = btns[i];
            var t = (b && b.textContent) ? String(b.textContent).replace(/\s+/g, ' ').trim().toLowerCase() : '';
            if (t === 'logout') return b;
          }

          // Fallback to anchor
          var links = document.querySelectorAll('a');
          for (var j = 0; j < links.length; j++) {
            var a = links[j];
            var at = (a && a.textContent) ? String(a.textContent).replace(/\s+/g, ' ').trim().toLowerCase() : '';
            if (at === 'logout') return a;
          }

          return null;
        }

        function injectNextToLogout() {
          removeIfNotNeeded();
          if (!shouldShow()) return;

          var logoutEl = findLogoutControl();
          if (!logoutEl || !logoutEl.parentElement) return;

          // If already injected and placed, do nothing.
          var existing = document.getElementById('nav-data-entries');
          if (existing && existing.parentElement === logoutEl.parentElement) return;

          // Remove old fixed injected element (if any)
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }

          var entryEl;
          try {
            entryEl = logoutEl.cloneNode(true);
          } catch (e) {
            entryEl = document.createElement('button');
          }

          entryEl.id = 'nav-data-entries';
          entryEl.textContent = 'Data Entries';

          // Ensure it behaves like a button
          if (String(entryEl.tagName || '').toLowerCase() === 'a') {
            entryEl.setAttribute('href', '/data-entries.html');
          } else {
            entryEl.setAttribute('type', 'button');
          }

          // Small spacing if parent isn't using flex gap
          entryEl.style.marginRight = '10px';

          entryEl.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = '/data-entries.html';
          }, true);

          logoutEl.parentElement.insertBefore(entryEl, logoutEl);
        }

        function sync() {
          // Keep consistent even on SPA route changes
          injectNextToLogout();
        }

        sync();

        var mo = new MutationObserver(function () {
          sync();
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });

        // Some SPA navigations change URL without DOM mutations.
        setInterval(sync, 800);
      })();
    </script>
  </body>
</html>
