<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script type="module" crossorigin src="./landing_assets/index-Dur577wo.js"></script>
    <link rel="stylesheet" crossorigin href="./landing_assets/index-Hrx1Im0O.css">
    <style>
      /* Hide any in-app Admin Login links (keep only our global button) */
      a[href="/admin-login"]:not(#global-admin-login),
      a[href="admin-login"]:not(#global-admin-login),
      a[href$="/admin-login"]:not(#global-admin-login),
      a[href$="admin-login"]:not(#global-admin-login),
      a[href*="admin-login"]:not(#global-admin-login) {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="global-login-switcher" style="position: fixed; top: 50%; right: 16px; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; gap: 10px;">
      <a id="global-admin-login" href="/admin-login" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-900 shadow-sm transition hover:bg-slate-50">Admin Login</a>
      <button id="global-company-login" type="button" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-900 shadow-sm transition hover:bg-slate-50">Company Login</button>
    </div>
    <div id="root"></div>

    <script>
      (function () {
        function looksLikeAdminLoginHref(href) {
          if (!href) return false;
          try {
            href = String(href).trim().toLowerCase();
          } catch (e) {
            return false;
          }
          return href === '/admin-login' || href === 'admin-login' || href.endsWith('/admin-login') || href.endsWith('admin-login') || href.indexOf('admin-login') !== -1;
        }

        function hideElement(el) {
          if (!el || !el.style) return;
          el.style.display = 'none';
          el.style.visibility = 'hidden';
          el.style.pointerEvents = 'none';
        }

        function removeDuplicateAdminLoginButtons() {
          var switcher = document.getElementById('global-login-switcher');

          // Hide links whose href points to admin-login
          var links = document.querySelectorAll('a');
          for (var i = 0; i < links.length; i++) {
            var a = links[i];
            if (a.id === 'global-admin-login') continue;
            if (switcher && switcher.contains(a)) continue;

            var href = a.getAttribute('href');
            if (looksLikeAdminLoginHref(href)) {
              hideElement(a);
              continue;
            }

            var txt = (a.textContent || '').trim().toLowerCase();
            if (txt === 'admin login' || txt === 'admin') {
              hideElement(a);
            }
          }

          // Also hide any button that says Admin Login
          var buttons = document.querySelectorAll('button');
          for (var j = 0; j < buttons.length; j++) {
            var b = buttons[j];
            if (switcher && switcher.contains(b)) continue;
            var btxt = (b.textContent || '').trim().toLowerCase();
            if (btxt === 'admin login' || btxt === 'admin') {
              hideElement(b);
            }
          }
        }

        removeDuplicateAdminLoginButtons();
        var mo = new MutationObserver(function () {
          removeDuplicateAdminLoginButtons();
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <script>
      (function () {
        var a = document.getElementById('global-company-login');
        if (!a) return;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = '/founder-login.html';
        }, true);
      })();
    </script>
  </body>
</html>
