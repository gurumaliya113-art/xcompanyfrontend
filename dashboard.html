<!DOCTYPE html>
<html>
<head>
  <title>Login – The X Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ display:flex; align-items:center; justify-content:center; }
    .login-popup {
      padding: 48px 36px 36px 36px;
      width: 350px;
      animation: fadeIn 1.2s cubic-bezier(.77,0,.18,1) forwards;
      transform: scale(0.95);
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: scale(1); }
    }
    .login-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222;
      text-align: center;
      margin-bottom: 18px;
      text-shadow: 0 2px 8px #fff3;
    }
    .login-desc {
      color: #555;
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 32px;
      opacity: 0.8;
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: none;
      background: #f3f4f8;
      color: #222;
      font-size: 1.08rem;
      font-family: inherit;
      box-shadow: 0 2px 8px #e2e4ea;
      outline: none;
      transition: background 0.2s;
    }
    .login-input:focus {
      background: #e2e4ea;
    }
    .login-btn {
      width: 100%;
      margin-top: 8px;
    }
    #msg {
      color: #dc2626;
      text-align: center;
      margin-top: 18px;
      font-size: 1.05rem;
      min-height: 24px;
    }
    @media (max-width: 500px) {
      .login-popup { width: 98vw; padding: 32px 8vw; }
    }
  </style>
  <link rel="stylesheet" href="css/luxury-theme.css">
</head>
<body class="x-theme">

<div class="login-popup">
  <div class="login-title">The X Company</div>
  <div class="login-desc">Multi-Billionaire Login System<br>Welcome to the future of work.</div>
  <input id="email" class="login-input" type="email" placeholder="Email">
  <input id="password" class="login-input" type="password" placeholder="Password">
  <button class="login-btn" onclick="login()">Sign In</button>
  <div id="msg"></div>
</div>

<script>
const sb = supabase.createClient(
  "https://ecjxynuccpncwsogezos.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanh5bnVjY3BuY3dzb2dlem9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTQ1MjMsImV4cCI6MjA4NTc3MDUyM30.UJcsapv2REDm-RD4L0s3PkenmJ7NE0rHMeDVAA94qzM"
);
async function logout(){
  await sb.auth.signOut();
  window.location.href = "index.html";
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signInWithPassword({
    email, password
  });

  if(error){
    document.getElementById("msg").innerText = error.message;
    return;
  }

  // role nikaal
  const { data: emp } = await sb
    .from("employees")
    .select("role")
    .eq("id", data.user.id)
    .single();

  if(emp.role === "FOUNDER"){
    window.location.href = "founder.html";
  }
  else if(emp.role === "HR"){
    window.location.href = "hr.html";
  }
  else{
    window.location.href = "employee.html";
  }
}

</script>

</body>
</html>
