<!DOCTYPE html>
<html>
<head>
  <title>Login – The X Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ display:flex; align-items:center; justify-content:center; padding: 24px 14px; }
    .login-grid{
      width: min(940px, 98vw);
      display:flex;
      gap: 18px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }
    .login-popup {
      padding: 42px 34px 30px 34px;
      width: min(420px, 98vw);
      animation: fadeIn 1.2s cubic-bezier(.77,0,.18,1) forwards;
      transform: scale(0.95);
      opacity: 0;
      flex: 1 1 380px;
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: scale(1); }
    }
    .login-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222;
      text-align: center;
      margin-bottom: 18px;
      text-shadow: 0 2px 8px #fff3;
    }
    .login-desc {
      color: #555;
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 32px;
      opacity: 0.8;
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: none;
      background: #f3f4f8;
      color: #222;
      font-size: 1.08rem;
      font-family: inherit;
      box-shadow: 0 2px 8px #e2e4ea;
      outline: none;
      transition: background 0.2s;
    }
    .login-input:focus {
      background: #e2e4ea;
    }
    .login-btn {
      width: 100%;
      margin-top: 8px;
    }
    #msg {
      color: #dc2626;
      text-align: center;
      margin-top: 18px;
      font-size: 1.05rem;
      min-height: 24px;
    }
    .panel-title{
      font-weight: 800;
      text-align:center;
      margin-top: 2px;
      margin-bottom: 8px;
      letter-spacing: .3px;
    }
    .panel-sub{
      color:#555;
      text-align:center;
      font-size: .98rem;
      margin-bottom: 22px;
      opacity: .85;
    }
    @media (max-width: 700px) {
      .login-grid{ gap: 14px; }
      .login-popup { padding: 32px 8vw; }
    }
  </style>
</head>
<body class="x-theme">

<div class="login-grid">
  <div class="login-popup">
    <div class="login-title">The X Company</div>
    <div class="login-desc">Multi-Billionaire Login System<br>Welcome to the future of work.</div>
    <input id="email" class="login-input" type="email" placeholder="Email">
    <input id="password" class="login-input" type="password" placeholder="Password">
    <button class="login-btn" onclick="login()">Sign In</button>
    <div id="msg"></div>
  </div>

  <div class="login-popup">
    <div class="panel-title">PM Login</div>
    <div class="panel-sub">PM = Primary Manager</div>

    <select id="pmSelect" class="login-input" style="appearance:auto"></select>
    <button class="login-btn" onclick="pmLogin()">Enter PM Panel</button>
    <button class="login-btn" onclick="pmLogout()" style="opacity:.9">Logout PM</button>
    <div id="pmMsg"></div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://ecjxynuccpncwsogezos.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanh5bnVjY3BuY3dzb2dlem9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTQ1MjMsImV4cCI6MjA4NTc3MDUyM30.UJcsapv2REDm-RD4L0s3PkenmJ7NE0rHMeDVAA94qzM"
);
async function logout(){
  await sb.auth.signOut();
  window.location.href = "index.html";
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signInWithPassword({
    email, password
  });

  if(error){
    document.getElementById("msg").innerText = error.message;
    return;
  }

  // role nikaal
  const { data: emp } = await sb
    .from("employees")
    .select("role")
    .eq("id", data.user.id)
    .single();

  if(emp.role === "FOUNDER"){
    window.location.href = "founder.html";
  }
  else if(emp.role === "HR"){
    window.location.href = "hr.html";
  }
  else if(emp.role === "MANAGER" || emp.role === "DATA_ENTRY"){
    window.location.href = "data-entries.html";
  }
  else{
    window.location.href = "employee.html";
  }
}

function setPMMsg(text){
  const el = document.getElementById("pmMsg");
  if(el) el.innerText = text || "";
}

async function loadPMList(){
  setPMMsg("");
  const select = document.getElementById("pmSelect");
  if(!select) return;
  select.innerHTML = `<option value="">Loading...</option>`;

  const { data, error } = await sb.from("employees").select("id,name,role");
  if(error || !data){
    select.innerHTML = `<option value="">Failed to load PM list</option>`;
    setPMMsg(error?.message || "Failed to load employees");
    return;
  }

  const pms = (data || []).filter(e => {
    const role = String(e.role || "").toUpperCase();
    return role === "MANAGER" || role === "PRIMARY_MANAGER" || role === "PM";
  });

  if(pms.length === 0){
    select.innerHTML = `<option value="">No PM found</option>`;
    setPMMsg("No employees with role MANAGER/PRIMARY_MANAGER");
    return;
  }

  select.innerHTML = `<option value="">Select Primary Manager</option>` +
    pms.map(e => `<option value="${e.id}">${e.name} (${e.role})</option>`).join("");

  // restore selection if exists
  const saved = localStorage.getItem("xco_pm_employee_id");
  if(saved){
    select.value = saved;
  }
}

function pmLogin(){
  setPMMsg("");
  const select = document.getElementById("pmSelect");
  const id = select?.value;
  const name = select?.selectedOptions?.[0]?.textContent || "";
  if(!id){
    setPMMsg("Select PM");
    return;
  }
  localStorage.setItem("xco_pm_employee_id", id);
  localStorage.setItem("xco_pm_employee_label", name);
  window.location.href = "pm.html";
}

function pmLogout(){
  localStorage.removeItem("xco_pm_employee_id");
  localStorage.removeItem("xco_pm_employee_label");
  setPMMsg("PM logged out");
  const select = document.getElementById("pmSelect");
  if(select) select.value = "";
}

document.addEventListener("DOMContentLoaded", loadPMList);

</script>

</body>
</html>
