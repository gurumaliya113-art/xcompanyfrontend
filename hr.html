<!DOCTYPE html>
<html>
<head>
  <title>HR Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/luxury-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:0; }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      margin-top: 38px;
      margin-bottom: 18px;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #fff3;
      text-align: center;
    }
    .card {
      padding: 32px 28px;
      margin-bottom: 18px;
      width: 100%;
      max-width: 500px;
      animation: fadeInCard 1.1s cubic-bezier(.77,0,.18,1) forwards;
      opacity: 0;
      transform: scale(0.97);
    }
    @keyframes fadeInCard {
      to { opacity: 1; transform: scale(1); }
    }
    input, textarea { margin-top:10px; margin-bottom:18px; }
    button{ width:100%; margin-top:8px; }
    @media (max-width: 600px) {
      .card { max-width: 98vw; padding: 18px 8vw; }
    }
  </style>
</head>
<body class="x-theme">

<h1>HR PANEL</h1>

<div class="card">
  <h3>Create Task</h3>
  <input id="title" placeholder="Task title">
  <textarea id="desc" placeholder="Task description"></textarea>
  <input id="points" type="number" placeholder="Points">
  <input id="deadline" type="datetime-local" placeholder="Deadline">
  <button id="createBtn">Create Task</button>
</div>

<div class="card">
  <h3>All Tasks</h3>
  <div id="taskList">Loading...</div>

</div>

<script>
const sb = supabase.createClient(
  "https://ecjxynuccpncwsogezos.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanh5bnVjY3BuY3dzb2dlem9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTQ1MjMsImV4cCI6MjA4NTc3MDUyM30.UJcsapv2REDm-RD4L0s3PkenmJ7NE0rHMeDVAA94qzM"
);

// BUTTON CLICK (GUARANTEED)
document.getElementById("createBtn").addEventListener("click", async () => {
  alert("BUTTON CLICKED");

  const t = document.getElementById("title").value;
  const d = document.getElementById("desc").value;
  const p = Number(document.getElementById("points").value);
  const dl = document.getElementById("deadline").value;

  if(!t || !d || !p){
    alert("Fill all fields");
    return;
  }

  // Prefer the improved schema (status + deadline). Fallback if columns don't exist.
  let error;
  {
    const res = await sb.from("tasks").insert([{
      title: t,
      description: d,
      points: p,
      deadline: dl || null,
      status: "OPEN",
      accepted_by: null
    }]);
    error = res.error;
  }
  if(error && /column .*status|column .*accepted_by|column .*deadline/i.test(error.message || "")){
    const res2 = await sb.from("tasks").insert([{
      title: t,
      description: d,
      points: p
    }]);
    error = res2.error;
  }

  if(error){
    alert("DB ERROR: " + error.message);
    console.log(error);
    return;
  }

  alert("TASK CREATED");
  loadTasks();
});

// LOAD TASKS

async function loadTasks(){
  const { data } = await sb
    .from("tasks")
    .select("id,title,description,points,deadline,status,accepted_by,created_at")
    .order("created_at",{ascending:false});

  const empRes = await sb.from('employees').select('id,name');
  const empMap = {};
  (empRes.data || []).forEach(e => { empMap[e.id] = e.name; });

  let html = "";
  (data || []).forEach(t=>{
    const who = t.accepted_by ? (empMap[t.accepted_by] || t.accepted_by) : "-";
    const dl = t.deadline ? new Date(t.deadline).toLocaleString() : "-";
    html += `
      <div class="card" style="margin-bottom:10px">
        <b>${t.title}</b> (${t.points || 0} pts)<br>
        ${t.description || ""}<br>
        <div style="margin-top:8px;font-size:0.98rem;color:#444;line-height:1.35">
          Status: <b>${t.status || "OPEN"}</b><br>
          Accepted By: <b>${who}</b><br>
          Deadline: <b>${dl}</b>
        </div>
      </div>
    `;
  });

  document.getElementById("taskList").innerHTML = html || "No tasks yet";
}

loadTasks();
</script>

</body>
</html>
